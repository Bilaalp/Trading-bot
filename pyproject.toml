[project]
name = "trading-bot"
version = "0.1.0"
description = "Modular trading bot: backtest, paper trade, go live"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["ccxt>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
